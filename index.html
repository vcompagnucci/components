<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Interface exhibition</title>
    <meta
      name="description"
      content="Components for web and native apps that feel right."
    />

    <!-- El color del canvas. Pinta la barra del navegador en Android y
         la de Safari en iOS, así que el borde de la pantalla no corta
         contra un blanco distinto al de la página. -->
    <meta name="theme-color" content="#fdfdfc" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph. Sin og:url ni og:image todavía: no hay host elegido
         y no hay imagen. Se completan al desplegar. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interface exhibition" />
    <meta
      property="og:description"
      content="Components for web and native apps that feel right."
    />

    <!-- La fuente va self-hosteada (ver src/fonts.css). Se precarga
         sólo el subset latin en redonda, que es el único que la página
         necesita siempre; los otros tres los pide el navegador recién
         si aparece un carácter que los use. crossorigin es obligatorio
         en preload de fuentes aunque sean del mismo origen. -->
    <link
      rel="preload"
      href="/fonts/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
