<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Interface exhibition</title>
    <meta
      name="description"
      content="Components that feel right, for web and native apps."
    />

    <!-- The color of the canvas. It paints the browser bar on Android
         and Safari's bar on iOS, so the edge of the screen does not cut
         against a white that differs from the page's. -->
    <meta name="theme-color" content="#fdfdfc" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph. No og:url and no og:image yet: no host has been
         chosen and there is no image. Both get filled in on deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interface exhibition" />
    <meta
      property="og:description"
      content="Components that feel right, for web and native apps."
    />

    <!-- The font is self-hosted (see src/fonts.css). Only the upright
         latin subset is preloaded, which is the only one the page
         always needs; the browser asks for the other three only once a
         character that uses them shows up. crossorigin is mandatory on
         a font preload even when the font is same-origin. -->
    <link
      rel="preload"
      href="/fonts/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
