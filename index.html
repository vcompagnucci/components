<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>%SITE_NAME%</title>
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />

    <!-- The color of the canvas. It paints the browser bar on Android
         and Safari's bar on iOS, so the edge of the screen does not cut
         against a white that differs from the page's. -->
    <meta name="theme-color" content="#fdfdfc" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph. The why is in src/site.ts, which does not ship a
         comment; this file does. og:image is still missing. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta
      property="og:description"
      content="%SITE_DESCRIPTION%"
    />

    <!-- The font is self-hosted (see src/fonts.css). Only the upright
         latin subset is preloaded, which is the only one the page
         always needs; the browser asks for the other three only once a
         character that uses them shows up. crossorigin is mandatory on
         a font preload even when the font is same-origin. -->
    <link
      rel="preload"
      href="/fonts/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
